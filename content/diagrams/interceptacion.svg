<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="760" height="360" fill="#f8fafc"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker></defs>
  <text x="20" y="28" font-size="15" font-weight="bold" fill="#0f172a">DC 30 · interceptar el curso de acercamiento 030 con cabeza 070</text>
  <!-- VOR at (420,80). course 030 inbound: line arriving from SSW toward VOR; radial 210 -->
  <polygon points="420,68 431,74 431,86 420,92 409,86 409,74" fill="#fff" stroke="#0f172a" stroke-width="2"/>
  <text x="440" y="84" font-size="13" font-weight="bold">VOR</text>
  <line x1="270" y1="340" x2="420" y2="80" stroke="#1e3a8a" stroke-width="3"/>
  <text x="240" y="300" font-size="12.5" fill="#1e3a8a" font-weight="bold">curso deseado 030</text>
  <!-- aircraft on radial 250 (QDM 070): position SW-W of VOR -->
  <circle cx="160" cy="185" r="7" fill="#0f172a"/><text x="70" y="180" font-size="12.5">Avión (cabeza 070,</text><text x="70" y="196" font-size="12.5">cola/radial 250)</text>
  <line x1="160" y1="185" x2="420" y2="80" stroke="#94a3b8" stroke-dasharray="5 5"/>
  <!-- intercept heading 100 -->
  <path d="M168,186 L322,213" stroke="#b45309" stroke-width="3" marker-end="url(#a)"/>
  <text x="200" y="230" font-size="13" font-weight="bold" fill="#b45309">rumbo 100</text>
  <g font-size="13" fill="#0f172a">
    <text x="470" y="160" font-weight="bold">Deseada 030 → Cabeza 070 → +30</text>
    <text x="470" y="180">= rumbo de interceptación 100</text>
    <text x="470" y="215">Acercamiento directa: DC 30</text>
    <text x="470" y="235">Alejamiento directa: CD 45</text>
    <text x="470" y="255">Acercamiento pasada: rumbo radial,</text>
    <text x="480" y="273">al través 1 min, 90° a la estación</text>
    <text x="470" y="293">Alejamiento pasada: rumbo radial,</text>
    <text x="480" y="311">al través 45° a la estación</text>
  </g>
</svg>
