<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="760" height="420" fill="#f8fafc"/>
  <text x="20" y="28" font-size="15" font-weight="bold" fill="#0f172a">Sectores de entrada · espera estándar, curso de acercamiento 360°</text>
  <!-- fix at center (300,220). inbound from south (aircraft flies north to fix). hold on east side, outbound south. -->
  <g transform="translate(300,220)">
    <!-- sectors by direction FROM which aircraft arrives (position relative to fix) -->
    <!-- sector 3 direct (180°): headings 290..110 through 360 -> aircraft comes from the south-ish half: positions bearing 110..290 via 180 -->
    <path d="M0,0 L148.9,54.2 A160,160 0 0 1 -150.4,54.7 Z" fill="#fecaca"/>
    <path d="M0,0 L-150.4,54.7 A160,160 0 0 1 0,-160 Z" fill="#c7d2fe"/>
    <path d="M0,0 L0,-160 A160,160 0 0 1 148.9,54.2 Z" fill="#d9f99d"/>
    <circle r="160" fill="none" stroke="#334155"/>
    <!-- holding pattern on east side -->
    <path d="M0,0 L0,-1 M0,0 A35,35 0 0 1 70,0 L70,110 A35,35 0 0 1 0,110 Z" fill="none" stroke="#1e3a8a" stroke-width="3" transform="translate(0,-0)"/>
    <path d="M0,110 L0,4" stroke="#1e3a8a" stroke-width="4"/>
    <circle r="5" fill="#0f172a"/>
  </g>
  <text x="312" y="215" font-size="12" font-weight="bold" fill="#0f172a">FIJO</text>
  <text x="140" y="330" font-size="14" font-weight="bold" fill="#991b1b">Sector 3 · DIRECTA (180°)</text>
  <text x="150" y="130" font-size="14" font-weight="bold" fill="#3730a3">Sector 2 · GOTA</text>
  <text x="180" y="148" font-size="12" fill="#3730a3">(70°)</text>
  <text x="320" y="110" font-size="14" font-weight="bold" fill="#3f6212">Sector 1 · PARALELA</text>
  <text x="370" y="128" font-size="12" fill="#3f6212">(110°)</text>
  <g font-size="12.5" fill="#0f172a">
    <text x="490" y="70" font-weight="bold">Regla de la mano (H = rumbo al fijo)</text>
    <text x="490" y="95">Espera derecha → mano derecha:</text>
    <text x="500" y="113">alejamiento en [H−110, H] → paralela</text>
    <text x="500" y="131">en [H, H+70] → gota</text>
    <text x="500" y="149">resto → directa</text>
    <text x="490" y="177">Espera izquierda → mano izquierda:</text>
    <text x="500" y="195">[H, H+110] → paralela</text>
    <text x="500" y="213">[H−70, H] → gota · resto → directa</text>
    <text x="490" y="245">±5° de flexibilidad en los límites:</text>
    <text x="500" y="263">directa &gt; paralela · gota &gt; las demás</text>
    <text x="490" y="295" font-weight="bold" fill="#b91c1c">SPP: solo se evalúa la DIRECTA</text>
  </g>
  <text x="20" y="405" font-size="11.5" fill="#475569">Zonas según desde dónde se llega al fijo: el NE (0–110°) es paralela, el NO (290–360°) gota y el sur directa.</text>
</svg>
